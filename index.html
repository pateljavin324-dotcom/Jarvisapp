<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Direct Node</title>
    <style>
        body { background-color: #050505; color: #00ff66; font-family: monospace; padding: 25px; text-align: center; }
        h2 { text-shadow: 0 0 8px #00ff66; letter-spacing: 2px; }
        input, textarea { width: 100%; max-width: 320px; padding: 12px; margin: 10px 0; background: #111; border: 1px solid #00ff66; color: #fff; border-radius: 4px; box-sizing: border-box; font-family: monospace; }
        .glow-btn { background-color: transparent; color: #00ff66; border: 2px solid #00ff66; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: transform 0.1s ease; width: 100%; max-width: 320px; text-shadow: 0 0 5px #00ff66; box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); }
        .glow-btn:active { transform: scale(0.92); background-color: rgba(0, 255, 102, 0.1); }
        .history-box { background: #111; border: 1px dashed #00ff66; border-radius: 4px; max-width: 320px; margin: 20px auto; padding: 15px; text-align: left; max-height: 150px; overflow-y: auto; }
        .history-item { font-size: 12px; color: #a1a1a1; border-bottom: 1px solid #222; padding: 5px 0; }
    </style>
</head>
<body>

    <h2>[ JARVIS DIRECT CLOUD ]</h2>
    <p style="font-size:12px; color:#888;">Secure matrix node routing directly inside GitHub mainframe.</p>
    
    <input type="text" id="username" placeholder="ENTER HANDLE / ID">
    <textarea id="message" rows="3" placeholder="TYPE PAYLOAD MESSAGE..."></textarea>
    <br>
    <button class="glow-btn" onclick="sendDataStream()">EXECUTE BROADCAST</button>
    
    <div style="margin-top:20px; font-size:12px; color:#888; text-align:left; max-width:320px; margin-left:auto; margin-right:auto;">Your Transmission History:</div>
    <div class="history-box" id="logBox"><div style="color:#444; font-size:12px;">Local log memory empty.</div></div>

    <script>
        window.onload = function() { displayLogs(); };

        function sendDataStream() {
            const user = document.getElementById('username').value.trim() || "Anonymous";
            const text = document.getElementById('message').value.trim();
            if (!text) { alert("Cannot broadcast empty signal stream."); return; }

            // 1. CHANGE THESE THREE VARIABLES TO MATCH YOUR GITHUB PROFILE EXACTLY:
            const githubUsername = "pateljavin324-dotcom"; 
            const repositoryName = "Jarvisapp"; 
            const secureToken = "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"; 

            const targetEndpoint = `https://github.com{githubUsername}/${repositoryName}/issues`;

            const issuePayload = {
                title: `SIGNAL DETECTED: From ${user}`,
                body: `### User Handle\n${user}\n\n### Intercepted Payload\n${text}\n\n### Timestamp\n${new Date().toLocaleString()}`
            };

            fetch(targetEndpoint, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${secureToken}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(issuePayload)
            })
            .then(res => {
                if(res.ok) {
                    let entries = JSON.parse(localStorage.getItem('jarvis_cache')) || [];
                    entries.unshift({ msgContent: text, timeStamp: new Date().toLocaleTimeString() });
                    localStorage.setItem('jarvis_cache', JSON.stringify(entries));
                    document.getElementById('message').value = "";
                    displayLogs();
                } else {
                    alert("Uplink dropped. Token or Repository name mismatch.");
                }
            })
            .catch(err => alert("Connection error. GitHub cloud unreachable."));
        }

        function displayLogs() {
            const box = document.getElementById('logBox');
            let entries = JSON.parse(localStorage.getItem('jarvis_cache')) || [];
            if(entries.length === 0) return;
            box.innerHTML = "";
            entries.forEach(e => {
                box.innerHTML += `<div class="history-item"><span style="color:#00ff66">[${e.timeStamp}]</span> ${e.msgContent}</div>`;
            });
        }
    </script>
</body>
</html>
